[platformio]
default_envs = m5stick-c

[env:m5stick-c]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    m5stack/M5StickC @ ^0.2.5

[env:m5stick-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DMAGICPILOT_STICK_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified#e125e73f28b6b83e621e48df432af426bb2ff935
    m5stack/M5GFX @ 0.2.33
    M5PM1=https://github.com/m5stack/M5PM1#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
